services:
  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    # Intentionally no public port. Only Caddy can reach the API.

  web:
    build:
      context: .
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_PORTAL: ${SITE_PORTAL:-http://localhost:8080}
      SITE_TEAMPIX: ${SITE_TEAMPIX:-http://localhost:8081}
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8081:8081"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
